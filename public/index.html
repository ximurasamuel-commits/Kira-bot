<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kira Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f1015;
            color: #ffffff;
            padding: 16px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 8px;
            color: #ff3344;
        }
        .subtitle {
            font-size: 14px;
            color: #8b8e9b;
            margin-bottom: 20px;
        }
        .categories {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .category-card {
            background: #1a1b24;
            border: 1px solid #2a2c3d;
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        .category-card:active {
            transform: scale(0.98);
            border-color: #ff3344;
        }
        .category-card h3 {
            font-size: 18px;
            margin-bottom: 4px;
        }
        .category-card p {
            font-size: 13px;
            color: #8b8e9b;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: flex-end;
            z-index: 100;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: #161722;
            width: 100%;
            max-height: 85vh;
            border-top-left-radius: 20px;
            border
