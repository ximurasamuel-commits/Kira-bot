<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samuel Group // Portal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #08090d;
            --card-bg: #13151f;
            --card-border: #232638;
            --accent-red: #ff3344;
            --accent-gold: #ffcc00;
            --text-main: #ffffff;
            --text-muted: #8b8e9b;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            margin-bottom: 24px;
        }
        h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: var(--accent-red);
            margin-bottom: 6px;
        }
        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }
        .categories {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .category-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .category-card:active {
            transform: scale(0.97);
            border-color: var(--accent-red);
        }
        .category-card h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .category-card p {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: flex-end;
            z-index: 100;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: #11131c;
            width: 100%;
            max-height: 90vh;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 24px;
            overflow-y: auto;
            box-shadow: 0 -20px 40px rgba(0,0,0,0.6);
            border-top: 1px solid #2a2e45;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .back-btn {
            background: #1c1f30;
            border: 1px solid #2d324f;
            color: var(--text-main);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 8px;
            margin-bottom: 18px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .back-btn:active {
            background: #282d47;
        }
        .modal-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .modal-desc {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .service-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #181a26;
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 10px;
            border: 1px solid #24283b;
        }
        .service-name {
            font-size: 13px;
            font-weight: 600;
            max-width: 65%;
        }
        .service-price {
            font-size: 14px;
            font-weight: 800;
            color: var(--accent-gold);
        }
        .card-payment {
            background: #181a26;
            border: 1px dashed var(--accent-gold);
            border-radius: 12px;
            padding: 16px;
            margin-top: 24px;
            text-align: center;
        }
        .card-payment span {
            font-size: 11px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .card-payment strong {
            font-size: 18px;
            color: var(--accent-gold);
            letter-spacing: 1.5px;
            font-family: monospace;
        }
        .copy-btn {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            margin-top: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
        }
