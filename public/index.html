<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samuel Group // Portal</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#08090d;--card:#13151f;--border:#232638;--red:#ff3344;--gold:#ffcc00;--text:#fff;--muted:#8b8e9b}
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);padding:20px;min-height:100vh}
header{margin-bottom:24px}
h1{font-size:24px;font-weight:800;color:var(--red);margin-bottom:6px}
.subtitle{font-size:13px;color:var(--muted)}
.categories{display:flex;flex-direction:column;gap:14px}
.category-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;cursor:pointer;transition:.2s}
.category-card:active{transform:scale(.97);border-color:var(--red)}
.category-card h3{font-size:18px;margin-bottom:6px}
.category-card p{font-size:13px;color:var(--muted);line-height:1.4}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);justify-content:center;align-items:flex-end;z-index:100}
.modal.active{display:flex}
.modal-content{background:#11131c;width:100%;max-height:90vh;border-radius:24px 24px 0 0;padding:24px;overflow-y:auto;border-top:1px solid #2a2e45}
.back-btn{background:#1c1f30;border:1px solid #2d324f;color:#fff;cursor:pointer;font-size:13px;font-weight:600;padding:8px 14px;border-radius:8px;margin-bottom:18px}
.modal-title{font-size:22px;font-weight:800;margin-bottom:8px}
.modal-desc{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.5}
.service-item{display:flex;justify-content:space-between;align-items:center;background:#181a26;padding:14px 16px;border-radius:12px;margin-bottom:10px;border:1px solid #24283b}
.service-name{font-size:13px;font-weight:600;max-width:65%}
.service-price{font-size:14px;font-weight:800;color:var(--gold)}
.card-payment{background:#181a26;border:1px dashed var(--gold);border-radius:12px;padding:16px;margin-top:24px;text-align:center}
.card-payment span{font-size:11px;color:var(--muted);display:block;margin-bottom:6px}
.card-payment strong{font-size:18px;color:var(--gold);letter-spacing:1.5px;font-family:monospace}
.copy-btn{background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;border:none;width:100%;padding:14px;border-radius:12px;font-weight:700;font-size:14px;margin-top:12px;cursor:pointer}
</style>
</head>
<body>
<header><h1>SAMUEL GROUP // PORTAL</h1><div class="subtitle">Eksklyuziv xizmatlar va mahsulotlar katalogi</div></header>
<div class="categories" id="categoriesContainer"></div>
<div class="modal" id="serviceModal"><div class="modal-content">
<button class="back-btn" onclick="closeModal()">← Ortga</button>
<div class="modal-title" id="modalTitle"></div>
<div class="modal-desc" id="modalDesc"></div>
<div id="modalItems"></div>
<div class="card-payment"><span>TO'LOV UCHUN KARTA (HUMO)</span><strong>9860 3501 4998 0922</strong></div>
<button class="copy-btn" onclick="copyCard()">📋 Karta raqamini nusxalash</button>
</div></div>
<script>
const tg=window.Telegram.WebApp;tg.expand();
const servicesData={
games:{title:"Samuel Games Studios",desc:"Eksklyuziv 3D horror va indie o'yinlar.",items:[{name:"O'yinlar bazasi va relizlar",price:"TEZ KUNDA 🚀"}]},
software:{title:"Dasturiy Ta'minot",desc:"C++, Qt, Python va botlar.",items:[{name:"Sayt yaratish",price:"$500 - $1,000"},{name:"Desktop dastur yaratish",price:"$600 - $1,200"},{name:"Telegram bot yaratish",price:"$1,500+"}]},
youtube:{title:"YouTube Konsultatsiya",desc:"SEO, kontent strategiyasi va audit.",items:[{name:"1 SOATLIK STRATEGIK MASLAHAT",price:"$70"},{name:"TO'LIQ KANAL AUDITI",price:"$200"},{name:"OYLIK MEDIA-KO'MAK",price:"$600 / oy"}]}
};
const c=document.getElementById('categoriesContainer');
for(const[k,v]of Object.entries(servicesData)){const d=document.createElement('div');d.className='category-card';d.onclick=()=>openModal(k);d.innerHTML='<h3>'+v.title+'</h3><p>'+v.desc+'</p>';c.appendChild(d);}
function openModal(k){const d=servicesData[k];document.getElementById('modalTitle').innerText=d.title;document.getElementById('modalDesc').innerText=d.desc;const ic=document.getElementById('modalItems');ic.innerHTML='';d.items.forEach(i=>{const e=document.createElement('div');e.className='service-item';e.innerHTML='<span class="service-name">'+i.name+'</span><span class="service-price">'+i.price+'</span>';ic.appendChild(e);});document.getElementById('serviceModal').classList.add('active');if(tg.HapticFeedback)tg.HapticFeedback.impactOccurred('light');}
function closeModal(){document.getElementById('serviceModal').classList.remove('active');if(tg.HapticFeedback)tg.HapticFeedback.impactOccurred('light');}
function copyCard(){navigator.clipboard.writeText("9860350149980922").then(()=>{if(tg.HapticFeedback)tg.HapticFeedback.notificationOccurred('success');alert("Karta raqami nusxalandi!");});}
</script>
</body>
</html>
