<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samuel Group // Portal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #08090d;
            --card-bg: #13151f;
            --card-border: #232638;
            --accent-red: #ff3344;
            --accent-gold: #ffcc00;
            --text-main: #ffffff;
            --text-muted: #8b8e9b;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            margin-bottom: 24px;
        }
        h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: var(--accent-red);
            margin-bottom: 6px;
        }
        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }
        .categories {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .category-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }
        .category-card:active {
            transform: scale(0.97);
            border-color: var(--accent-red);
        }
        .category-card h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .category-card p {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
        }
        
        /* Modal Overlay */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: flex-end;
            z-index: 100;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: #11131c;
            width: 100%;
            max-height: 90vh;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 24px;
            overflow-y: auto;
            box-shadow: 0 -20px 40px rgba(0,0,0,0.6);
            border-top: 1px solid #2a2e45;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .back-btn {
            background: #1c1f30;
            border: 1px solid #2d324f;
            color: var(--text-main);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 8px;
            margin-bottom: 18px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .back-btn:active {
            background: #282d47;
        }
        .modal-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .modal-desc {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .service-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #181a26;
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 10px;
            border: 1px solid #24283b;
        }
        .service-name {
            font-size: 13px;
            font-weight: 600;
            max-width: 65%;
        }
        .service-price {
            font-size: 14px;
            font-weight: 800;
            color: var(--accent-gold);
        }
        .card-payment {
            background: #181a26;
            border: 1px dashed var(--accent-gold);
            border-radius: 12px;
            padding: 16px;
            margin-top: 24px;
            text-align: center;
        }
        .card-payment span {
            font-size: 11px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .card-payment strong {
            font-size: 18px;
            color: var(--accent-gold);
            letter-spacing: 1.5px;
            font-family: monospace;
        }
        .copy-btn {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            margin-top: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
            transition: 0.2s;
        }
        .copy-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <header>
        <h1>SAMUEL GROUP // PORTAL</h1>
        <div class="subtitle">Eksklyuziv xizmatlar va mahsulotlar katalogi</div>
    </header>

    <div class="categories" id="categoriesContainer"></div>

    <div class="modal" id="serviceModal">
        <div class="modal-content">
            <button class="back-btn" onclick="closeModal()">← Ortga</button>
            <div class="modal-title" id="modalTitle"></div>
            <div class="modal-desc" id="modalDesc"></div>
            <div id="modalItems"></div>
            
            <div class="card-payment">
                <span>TO'LOV UCHUN KARTA (HUMO)</span>
                <strong>9860 3501 4998 0922</strong>
            </div>
            <button class="copy-btn" onclick="copyCard()">📋 Karta raqamini nusxalash</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const servicesData = {
            games: {
                title: "Samuel Games Studios",
                desc: "Eksklyuziv 3D horror va indie o'yinlar. Atmosferali, immersiv tajriba. Har bir loyiha — maxsus dunyo va storyline.",
                items: [
                    { name: "O'yinlar bazasi va relizlar", price: "TEZ KUNDA 🚀" }
                ]
            },
            software: {
                title: "Dasturiy Ta'minot",
                desc: "C++, Qt, Electron, Python va custom skriptlar. Desktop/Web ilovalar, avtomatlashtirish tizimlari va botlar noldan yaratiladi.",
                items: [
                    { name: "Sayt yaratish", price: "$500 - $1,000" },
                    { name: "Desktop dastur yaratish", price: "$600 - $1,200" },
                    { name: "Telegram bot yaratish", price: "$1,500+" }
                ]
            },
            youtube: {
                title: "YouTube Konsultatsiya",
                desc: "14-15 yillik tajriba: SEO, kontent strategiyasi, media menejment, kanal o'sishi. Shaxsiy maslahat va professional audit.",
                items: [
                    { name: "1 SOATLIK STRATEGIK MASLAHAT", price: "$70" },
                    { name: "TO'LIQ KANAL AUDITI VA O'SISH STRATEGIYASI", price: "$200" },
                    { name: "OYLIK TO'LIQ MEDIA-KO'MAK", price: "$600 / oy" }
                ]
            }
        };

        const container = document.getElementById('categoriesContainer');

        for (const [key, val] of Object.entries(servicesData)) {
            const card = document.createElement('div');
            card.className = 'category-card';
            card.onclick = () => openModal(key);
            card.innerHTML = `
                <h3>${val.title}</h3>
                <p>${val.desc}</p>
            `;
            container.appendChild(card);
        }

        function openModal(key) {
            const data = servicesData[key];
            document.getElementById('modalTitleinnerText' || 'modalTitle').innerText = data.title;
            document.getElementById('modalDesc').innerText = data.desc;
            
            const itemsContainer = document.getElementById('modalItems');
            itemsContainer.innerHTML = '';
            
            data.items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'service-item';
                div.innerHTML = `
                    <span class="service-name">${item.name}</span>
                    <span class="service-price">${item.price}</span>
                `;
                itemsContainer.appendChild(div);
            });

            document.getElementById('serviceModal').classList.add('active');
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }

        function closeModal() {
            document.getElementById('serviceModal').classList.remove('active');
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }

        function copyCard() {
            const cardNumber = "9860350149980922";
            navigator.clipboard.writeText(cardNumber).then(() => {
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                alert("Karta raqami nusxalandi!");
            });
        }

        window.onclick = function(event) {
            const modal = document.getElementById('serviceModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
