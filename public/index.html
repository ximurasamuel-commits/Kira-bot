<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samuel Games Studios</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --accent-red: #ff3344;
            --accent-gold: #ffcc00;
            --text-main: #ffffff;
            --text-muted: #8b8e9b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body {
            background: linear-gradient(rgba(8, 9, 13, 0.88), rgba(8, 9, 13, 0.88)), url('main-bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header { margin-bottom: 24px; }
        h1 { font-size: 22px; font-weight: 800; color: var(--accent-red); margin-bottom: 6px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .subtitle { font-size: 13px; color: var(--text-muted); font-weight: 500; }
        .categories { display: flex; flex-direction: column; gap: 14px; flex-grow: 1; }
        
        .category-card {
            position: relative;
            background-size: cover;
            background-position: center;
            border-radius: 16px;
            padding: 20px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .category-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(10, 11, 16, 0.82);
            z-index: 1;
            transition: background 0.25s ease;
        }
        .category-card:active { transform: scale(0.97); border-color: var(--accent-red); }
        .category-card:active::before { background: rgba(10, 11, 16, 0.7); }
        
        .card-content { position: relative; z-index: 2; }
        .category-card h3 { font-size: 18px; font-weight: 700; margin-bottom: 6px; color: var(--text-main); }
        .category-card p { font-size: 13px; color: var(--text-muted); line-height: 1.4; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.88); backdrop-filter: blur(8px); justify-content: center; align-items: flex-end; z-index: 100; }
        .modal.active { display: flex; }
        
        .modal-content {
            background-size: cover;
            background-position: center;
            width: 100%;
            max-height: 85vh;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 24px;
            overflow-y: auto;
            border-top: 1px solid rgba(255,255,255,0.15);
            position: relative;
        }
        .modal-content::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(13, 15, 22, 0.92);
            z-index: 1;
        }
        .modal-content > * { position: relative; z-index: 2; }

        .back-btn { background: #1c1f30; border: 1px solid #2d324f; color: var(--text-main); cursor: pointer; font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 8px; margin-bottom: 18px; }
        .modal-title { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
        .modal-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; }
        .service-item { display: flex; justify-content: space-between; align-items: center; background: rgba(24, 26, 38, 0.85); padding: 14px 16px; border-radius: 12px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.08); }
        .service-name { font-size: 13px; font-weight: 600; max-width: 55%; }
        .service-price { font-size: 14px; font-weight: 800; color: var(--accent-gold); }
        .buy-btn { background: var(--accent-red); color: #fff; border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
        .buy-btn:active { transform: scale(0.95); }
        
        .card-payment { background: rgba(24, 26, 38, 0.85); border: 1px dashed var(--accent-gold); border-radius: 12px; padding: 16px; margin-top: 20px; text-align: center; }
        .card-payment span { font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 6px; text-transform: uppercase; }
        .card-payment strong { font-size: 17px; color: var(--accent-gold); letter-spacing: 1.5px; font-family: monospace; }
        .copy-btn { background: linear-gradient(135deg, #7c3aed, #6d28d9); color: #fff; border: none; width: 100%; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 14px; margin-top: 12px; cursor: pointer; }
        .footer-brand { text-align: center; font-size: 11px; color: var(--text-muted); margin-top: 20px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    </style>
</head>
<body>
    <header>
        <h1>SAMUEL GAMES STUDIOS</h1>
        <div class="subtitle">Eksklyuziv xizmatlar va mahsulotlar katalogi</div>
    </header>

    <div class="categories" id="categoriesContainer"></div>

    <div class="modal" id="serviceModal">
        <div class="modal-content" id="modalContentBox">
            <button class="back-btn" onclick="closeModal()">← Ortga</button>
            <div class="modal-title" id="modalTitle"></div>
            <div class="modal-desc" id="modalDesc"></div>
            <div id="modalItems"></div>
            <div id="paymentSection">
                <div class="card-payment">
                    <span>TO'LOV UCHUN KARTA (HUMO)</span>
                    <strong>9860 3501 4998 0922</strong>
                </div>
                <button class="copy-btn" onclick="copyCard()">📋 Karta raqamini nusxalash</button>
            </div>
        </div>
    </div>

    <div class="footer-brand">@SamuelShopbot</div>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg && typeof tg.expand === 'function') {
            try { tg.expand(); } catch (e) {}
        }

        const servicesData = {
            games: {
                title: "Samuel Games Studios",
                desc: "Eksklyuziv 3D horror va indie o'yinlar. Atmosferali, immersiv tajriba.",
                bg: "games.jpg",
                showPayment: false,
                items: [{ name: "O'yinlar bazasi va relizlar", price: "TEZ KUNDA 🚀", action: false }]
            },
            software: {
                title: "Dasturiy Ta'minot",
                desc: "C++, Qt, Electron, Python va custom skriptlar. Desktop/Web ilovalar va botlar.",
                bg: "software.jpg",
                showPayment: true,
                items: [
                    { name: "Sayt yaratish", price: "$500 - $1,000", action: true },
                    { name: "Desktop dastur yaratish", price: "$600 - $1,200", action: true },
                    { name: "Telegram bot yaratish", price: "$1,500+", action: true }
                ]
            },
            youtube: {
                title: "YouTube Konsultatsiya",
                desc: "15 yillik tajriba: SEO, kontent strategiyasi, media menejment va audit.",
                bg: "youtube.jpg",
                showPayment: true,
                items: [
                    { name: "1 SOATLIK STRATEGIK MASLAHAT", price: "$70", action: true },
                    { name: "TO'LIQ KANAL AUDITI", price: "$200", action: true },
                    { name: "OYLIK MEDIA-KO'MAK", price: "$600 / oy", action: true }
                ]
            },
            purchases: {
                title: "Mening Xaridlarim",
                desc: "Siz tanlagan va buyurtma bergan xizmatlar avtomatik ravishda shu yerda saqlanadi.",
                bg: "main-bg.jpg",
                showPayment: false,
                isPurchases: true,
                items: []
            }
        };

        const container = document.getElementById('categoriesContainer');
        if (container) {
            for (const [key, val] of Object.entries(servicesData)) {
                const card = document.createElement('div');
                card.className = 'category-card';
                card.style.backgroundImage = `url('${val.bg}')`;
                card.onclick = () => openModal(key);
                card.innerHTML = `
                    <div class="card-content">
                        <h3>${val.title}</h3>
                        <p>${val.desc}</p>
                    </div>
                `;
                container.appendChild(card);
            }
        }

        function getPurchases() {
            try {
                return JSON.parse(localStorage.getItem('samuel_purchases')) || [];
            } catch (e) {
                return [];
            }
        }

        function addPurchase(name, price) {
            let purchases = getPurchases();
            purchases.push({ name, price, date: new Date().toLocaleDateString() });
            localStorage.setItem('samuel_purchases', JSON.stringify(purchases));
            alert("Xaridlar bo'limiga qo'shildi! 🚀");
            if (tg && tg.HapticFeedback && typeof tg.HapticFeedback.notificationOccurred === 'function') {
                try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
            }
        }

        function openModal(key) {
            const data = servicesData[key];
            if (!data) return;

            const titleEl = document.getElementById('modalTitle');
            const descEl = document.getElementById('modalDesc');
            const modalBox = document.getElementById('modalContentBox');
            const itemsContainer = document.getElementById('modalItems');
            const paymentSection = document.getElementById('paymentSection');

            if (titleEl) titleEl.innerText = data.title;
            if (descEl) descEl.innerText = data.desc;
            if (modalBox) modalBox.style.backgroundImage = `url('${data.bg}')`;

            if (paymentSection) {
                paymentSection.style.display = data.showPayment ? 'block' : 'none';
            }

            if (itemsContainer) {
                itemsContainer.innerHTML = '';
                
                let currentItems = data.items;
                if (data.isPurchases) {
                    currentItems = getPurchases();
                    if (currentItems.length === 0) {
                        itemsContainer.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding: 20px; font-size:13px;">Hozircha xaridlar mavjud emas. Xizmatlarni tanlab buyurtma bering!</div>';
                    }
                }

                currentItems.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'service-item';
                    
                    if (data.isPurchases) {
                        div.innerHTML = `<span class="service-name">${item.name} (${item.date || ''})</span><span class="service-price">${item.price}</span>`;
                    } else if (item.action) {
                        div.innerHTML = `<span class="service-name">${item.name}</span><span style="display:flex; align-items:center; gap:10px;"><span class="service-price">${item.price}</span><button class="buy-btn" onclick="event.stopPropagation(); addPurchase('${item.name.replace(/'/g, "\\'")}', '${item.price}')">Tanlash</button></span>`;
                    } else {
                        div.innerHTML = `<span class="service-name">${item.name}</span><span class="service-price">${item.price}</span>`;
                    }
                    itemsContainer.appendChild(div);
                });
            }

            const modalEl = document.getElementById('serviceModal');
            if (modalEl) modalEl.classList.add('active');

            if (tg && tg.HapticFeedback && typeof tg.HapticFeedback.impactOccurred === 'function') {
                try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
            }
        }

        function closeModal() {
            const modalEl = document.getElementById('serviceModal');
            if (modalEl) modalEl.classList.remove('active');
            if (tg && tg.HapticFeedback && typeof tg.HapticFeedback.impactOccurred === 'function') {
                try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
            }
        }

        function copyCard() {
            navigator.clipboard.writeText("9860350149980922").then(() => {
                if (tg && tg.HapticFeedback && typeof tg.HapticFeedback.notificationOccurred === 'function') {
                    try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
                }
                alert("Karta raqami nusxalandi!");
            }).catch(err => {
                alert("Karta raqami nusxalandi!");
            });
        }
    </script>
</body>
</html>
